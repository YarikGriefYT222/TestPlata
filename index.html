<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Stars Digital Store</title>
    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --link-color: var(--tg-theme-link-color, #38bdf8);
            --button-color: var(--tg-theme-button-color, #fbbf24);
            --button-text-color: var(--tg-theme-button-text-color, #0f172a);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --star-gold: #f59e0b;
            --star-glow: rgba(245, 158, 11, 0.3);
            --accent-purple: #8b5cf6;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 32px;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 12px var(--star-glow);
        }

        .user-info h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .user-info p {
            font-size: 12px;
            color: var(--hint-color);
        }

        .balance-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            color: var(--star-gold);
            font-size: 14px;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--hint-color);
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--button-color);
            color: var(--button-text-color);
            border-color: var(--button-color);
            box-shadow: 0 4px 12px var(--star-glow);
        }

        .store-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
            backdrop-filter: blur(12px);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-card.popular {
            border: 1.5px solid var(--star-gold);
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.15);
        }

        .badge-popular {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #f59e0b, #b45309);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }

        .product-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            border: 1px solid var(--card-border);
        }

        .product-title-group h4 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .product-title-group p {
            font-size: 13px;
            color: var(--hint-color);
            line-height: 1.4;
        }

        .product-features {
            list-style: none;
            margin: 14px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .product-features li {
            font-size: 12px;
            color: var(--text-color);
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .product-features li::before {
            content: "✓";
            color: #10b981;
            font-weight: bold;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 14px;
            border-top: 1px solid var(--card-border);
        }

        .price-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 800;
            color: var(--star-gold);
        }

        .buy-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px var(--star-glow);
        }

        .buy-btn:active {
            opacity: 0.85;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--secondary-bg-color);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 1px solid var(--card-border);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--hint-color);
            margin-top: 4px;
        }

        .checkout-details {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkout-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .checkout-row.total {
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
            font-weight: 700;
            font-size: 16px;
            color: var(--star-gold);
        }

        .confirm-btn {
            width: 100%;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 16px var(--star-glow);
        }

        .cancel-btn {
            width: 100%;
            background: transparent;
            color: var(--hint-color);
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- User Profile Header -->
        <header class="header">
            <div class="user-profile">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info">
                    <h3 id="userName">Пользователь</h3>
                    <p id="userTag">@telegram</p>
                </div>
            </div>
            <div class="balance-badge">
                <span>⭐</span>
                <span>Stars Shop</span>
            </div>
        </header>

        <!-- Category Navigation Tabs -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">Все товары</button>
            <button class="tab-btn" onclick="filterCategory('sub', this)">Подписки</button>
            <button class="tab-btn" onclick="filterCategory('perks', this)">Привилегии</button>
            <button class="tab-btn" onclick="filterCategory('credits', this)">Игровые токены</button>
        </div>

        <!-- Store Grid -->
        <main class="store-grid" id="storeGrid">
            <!-- Dynamic Items Inserted via JS -->
        </main>
    </div>

    <!-- Purchase Confirmation Modal -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon">⭐</div>
                <h3 class="modal-title" id="modalTitle">Подтверждение оплаты</h3>
                <p class="modal-desc" id="modalDesc">Покупка цифрового товара</p>
            </div>

            <div class="checkout-details">
                <div class="checkout-row">
                    <span>Товар:</span>
                    <strong id="modalItemName">-</strong>
                </div>
                <div class="checkout-row">
                    <span>Способ оплаты:</span>
                    <span>Telegram Stars ⭐</span>
                </div>
                <div class="checkout-row total">
                    <span>Итого к оплате:</span>
                    <span id="modalPrice">0 ⭐</span>
                </div>
            </div>

            <button class="confirm-btn" onclick="confirmPurchase()">Оплатить через Stars ⭐</button>
            <button class="cancel-btn" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast">Успешно!</div>

    <script>
        // Store Catalog Data
        const PRODUCTS = [
            {
                id: 'vip_pass',
                category: 'sub',
                title: 'VIP Подписка',
                desc: 'Полный доступ к боту на 30 дней без ограничений.',
                price: 50,
                icon: '👑',
                popular: true,
                features: ['Приоритетная скорость', 'Эксклюзивные функции', 'Без рекламы']
            },
            {
                id: 'pro_plan',
                category: 'sub',
                title: 'PRO Тариф',
                desc: 'Расширенные возможности на 3 месяца со скидкой.',
                price: 120,
                icon: '🚀',
                popular: false,
                features: ['Все VIP преимущества', 'Доступ к API', 'Поддержка 24/7']
            },
            {
                id: 'badge_star',
                category: 'perks',
                title: 'Статус "Премиум"',
                desc: 'Уникальная плашка и подсветка профиля в системе.',
                price: 25,
                icon: '💎',
                popular: false,
                features: ['Значок в профиле', 'Кастомный цвет ника']
            },
            {
                id: 'coins_100',
                category: 'credits',
                title: '100 Монет',
                desc: 'Пакет внутренней валюты для покупок в боте.',
                price: 15,
                icon: '🪙',
                popular: false,
                features: ['Мгновенный зачисление', 'Не сгорают']
            },
            {
                id: 'coins_500',
                category: 'credits',
                title: '500 Монет (+50 БОНУС)',
                desc: 'Большой выигрышный набор монет для активности.',
                price: 60,
                icon: '💰',
                popular: true,
                features: ['+50 Бонусных монет', 'Экономия 20%']
            }
        ];

        let tg = window.Telegram?.WebApp;
        let selectedProduct = null;

        // Initialize WebApp
        document.addEventListener('DOMContentLoaded', () => {
            if (tg) {
                tg.ready();
                tg.expand();
                
                // Initialize User Details from Telegram
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ');
                    document.getElementById('userName').textContent = fullName || 'Пользователь';
                    document.getElementById('userTag').textContent = user.username ? `@${user.username}` : `ID: ${user.id}`;
                    document.getElementById('userAvatar').textContent = (user.first_name || 'U').charAt(0).toUpperCase();
                }
            }

            renderProducts('all');
        });

        // Trigger Haptic Feedback
        function triggerHaptic(type = 'medium') {
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred(type);
            }
        }

        // Render Catalog Grid
        function renderProducts(category) {
            const grid = document.getElementById('storeGrid');
            grid.innerHTML = '';

            const filtered = category === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === category);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `product-card ${item.popular ? 'popular' : ''}`;
                card.onclick = () => openModal(item);

                card.innerHTML = `
                    ${item.popular ? '<div class="badge-popular">Популярное</div>' : ''}
                    <div class="product-header">
                        <div class="product-icon">${item.icon}</div>
                        <div class="product-title-group">
                            <h4>${item.title}</h4>
                            <p>${item.desc}</p>
                        </div>
                    </div>
                    <ul class="product-features">
                        ${item.features.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                    <div class="product-footer">
                        <div class="price-tag">
                            <span>⭐</span>
                            <span>${item.price}</span>
                        </div>
                        <button class="buy-btn" onclick="event.stopPropagation(); openModalByObj('${item.id}')">
                            Купить
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filter Categories
        function filterCategory(cat, btn) {
            triggerHaptic('light');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat);
        }

        function openModalByObj(id) {
            const item = PRODUCTS.find(p => p.id === id);
            if (item) openModal(item);
        }

        // Open Checkout Modal
        function openModal(item) {
            triggerHaptic('medium');
            selectedProduct = item;

            document.getElementById('modalIcon').textContent = item.icon;
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalDesc').textContent = item.desc;
            document.getElementById('modalItemName').textContent = item.title;
            document.getElementById('modalPrice').textContent = `${item.price} ⭐`;

            document.getElementById('checkoutModal').classList.add('active');
        }

        // Close Checkout Modal
        function closeModal() {
            triggerHaptic('light');
            document.getElementById('checkoutModal').classList.remove('active');
            selectedProduct = null;
        }

        // Confirm Purchase Action
        function confirmPurchase() {
            if (!selectedProduct) return;

            triggerHaptic('heavy');

            const payload = {
                action: 'buy_stars',
                item_id: selectedProduct.id,
                title: selectedProduct.title,
                price: selectedProduct.price
            };

            // Option A: If running inside Telegram WebApp, send data back to Python Bot
            if (tg && tg.sendData) {
                // Send purchase request command to Python backend
                tg.sendData(`/buy_stars ${selectedProduct.id}`);
                tg.close();
            } else {
                // Standalone / Browser Fallback Preview
                closeModal();
                showToast(`Запрос отправлен: ${selectedProduct.title}`);
            }
        }

        // Show Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
