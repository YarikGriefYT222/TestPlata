<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Донат Магазин</title>
    <!-- Подключаем Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 280px;
        }
        .price {
            font-size: 22px;
            color: #ffcc00;
            margin: 15px 0;
            font-weight: bold;
        }
        button {
            background-color: #24a1de;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #1b82b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>VIP Статус</h2>
        <p>Доступ к командам, особый суффикс и наборы предметов!</p>
        <div class="price">50 ⭐</div>
        <button onclick="buyItem()">Купить за Звёзды</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        async function buyItem() {
            // ВАЖНО: Замени этот URL на ссылку твоего Python-сервера (например, с Render.com)
            const SERVER_URL = "https://your-app.onrender.com/get-invoice";

            try {
                const response = await fetch(SERVER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });

                const data = await response.json();

                if (data.link) {
                    // Вызываем нативное окно оплаты Звёздами в Telegram
                    tg.openInvoice(data.link, (status) => {
                        if (status === 'paid') {
                            tg.showAlert("Оплата прошла успешно! VIP активирован.");
                        } else if (status === 'cancelled') {
                            tg.showAlert("Оплата отменена.");
                        } else {
                            tg.showAlert("Ошибка при совершении оплаты.");
                        }
                    });
                } else {
                    alert("Не удалось получить счёт.");
                }
            } catch (error) {
                console.error(error);
                alert("Ошибка подключения к серверу Python.");
            }
        }
    </script>
</body>
</html>
